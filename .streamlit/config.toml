[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "dark"
backgroundColor = "#031322"
secondaryBackgroundColor = "#031626"
textColor = "#e2e8f0"
primaryColor = "#00e5db"
